services:
  - type: web
    name: hewett-pos-backend
    env: ruby
    region: oregon
    plan: free
    buildCommand: bundle install
    startCommand: bundle exec ruby web.rb
    envVars:
      - key: STRIPE_TEST_SECRET_KEY
        sync: false # keep your existing test secret in the Render dashboard
      - key: POS_ADMIN_PIN
        sync: false # set this in Render; recommend an 8-digit or longer PIN
